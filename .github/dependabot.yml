# SPDX-License-Identifier: Apache-2.0
# Keeps Go modules and the SHA-pinned actions current. The cooldown lets a new
# release age a week before it is proposed, so a compromised or broken release
# is usually caught and pulled before it reaches this repository.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["dependencies"]
