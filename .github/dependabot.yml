# Keeps the Go module and the pinned GitHub Actions current. The cooldown waits
# a week after a release before proposing it, so a compromised or broken
# release has time to be caught and yanked upstream first. Action bumps arrive
# as one grouped pull request, not one per action.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
